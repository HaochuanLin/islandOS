name: Python dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Supersede stale PR audits while preserving scheduled and main-branch audits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.requirements }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements-ci.lock
          - requirements-runtime.lock
          - requirements-ml.lock
          - requirements-deep-learning.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-runtime.lock
            requirements-ml.lock
            requirements-deep-learning.txt
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependency file
        run: pip-audit --requirement "${{ matrix.requirements }}"
