name: Python dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit exact CI dependency lock
        run: pip-audit --requirement requirements-ci.lock
      - name: Audit exact runtime dependency lock
        run: pip-audit --requirement requirements-runtime.lock
      - name: Audit exact ML dependency lock
        run: pip-audit --requirement requirements-ml.lock
      - name: Audit optional deep-learning dependency closure
        run: pip-audit --requirement requirements-deep-learning.txt
