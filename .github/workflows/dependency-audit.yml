name: Python dependency audit

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit resolved core and ML dependencies
        run: pip-audit --requirement requirements-ml.txt
