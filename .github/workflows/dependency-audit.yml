name: Python dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Newer pushes supersede stale runs; scheduled/manual audits on main are preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'manual' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.requirements }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements-ci.lock
          - requirements-runtime.lock
          - requirements-ml.lock
          - requirements-deep-learning.txt
          - requirements-windows-packaging.lock
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-runtime.lock
            requirements-ml.lock
            requirements-deep-learning.txt
            requirements-windows-packaging.lock
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependency file and emit CycloneDX SBOM
        run: |
          mkdir -p build/sbom
          pip-audit --requirement "${{ matrix.requirements }}" \
            --format cyclonedx-json \
            --output "build/sbom/${{ matrix.requirements }}.cdx.json"
      - name: Upload Python dependency SBOM and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom-${{ matrix.requirements }}
          path: build/sbom/${{ matrix.requirements }}.cdx.json
          if-no-files-found: warn
          retention-days: 30
