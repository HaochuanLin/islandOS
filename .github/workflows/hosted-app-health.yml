name: Hosted Streamlit app health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/hosted-app-health.yml"
      - ".streamlit/config.toml"
      - "app.py"
      - "README.md"
      - "islandos_core/build_info.py"
      - "scripts/check_deployment.py"
      - "tests/test_build_info.py"
      - "tests/test_check_deployment.py"

permissions:
  contents: read

concurrency:
  group: islandos-hosted-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the headless browser that warms the app
        # A Streamlit script runs only when a session connects, so a fresh
        # container has no build stamp on disk until one does. This is the only
        # runtime dependency of the check, and it is pinned here rather than in
        # requirements-ci.lock because the unit-test job does not need a browser.
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install "playwright==1.65.2"
          python -m playwright install --with-deps chromium
      - name: Check what the hosted deployment can prove
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          # Only a scheduled or manual run asserts the commit: a push-triggered run
          # would race Streamlit Cloud's own update of the app files and report drift
          # that has not happened yet.
          EXPECT_COMMIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.sha || '' }}
        run: |
          python scripts/check_deployment.py \
            --base-url https://islandos.streamlit.app \
            --warm \
            --warm-timeout 150 \
            --expect-commit "$EXPECT_COMMIT" \
            --report hosted-health-report.json
      - name: Upload hosted deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: islandos-hosted-health-report
          path: hosted-health-report.json
          if-no-files-found: ignore
          retention-days: 30

