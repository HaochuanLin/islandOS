name: Container web smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Newer pushes supersede stale runs; scheduled/manual verification on main is preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'manual' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose deployment configuration
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        # Docker Hub outages should not block the fallback image build and smoke checks.
        continue-on-error: true
      - name: Build Streamlit web image with GitHub Actions cache
        if: steps.buildx.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: islandos-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Streamlit web image without remote BuildKit cache
        if: steps.buildx.outcome != 'success'
        run: |
          echo "::warning::Buildx initialization failed; falling back to Docker's local builder."
          DOCKER_BUILDKIT=1 docker build --tag islandos-web:ci .
      - name: Prepare SBOM output directory
        run: mkdir -p build/sbom
      - name: Generate CycloneDX SBOM for the built container image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: islandos-web:ci
          format: cyclonedx-json
          output-file: build/sbom/islandos-web-image.cdx.json
          artifact-name: islandos-web-image-sbom
          upload-artifact: true
          upload-artifact-retention: 30
          dependency-snapshot: false
          upload-release-assets: false
      - name: Start web app on loopback only
        run: docker run --detach --name islandos-web-ci --publish 127.0.0.1:8501:8501 islandos-web:ci
      - name: Verify container does not run as root
        run: test "$(docker exec islandos-web-ci id -u)" -ne 0
      - name: Wait for Streamlit health endpoint
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit health endpoint is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs islandos-web-ci
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs islandos-web-ci
      - name: Stop web container
        if: always()
        run: docker rm --force islandos-web-ci || true
