name: Release candidate verification

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/release-candidate.yml"
      - "docs/RELEASE_CHECKLIST.md"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create a draft GitHub release when this run targets a version tag
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: islandos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the exact release candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned test environment
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -r requirements-ci.lock
          python -m pip check
      - name: Validate release tag or create a non-publishing candidate name
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must look like vMAJOR.MINOR.PATCH (optional prerelease suffix)." >&2
              exit 1
            fi
          else
            TAG="candidate-${GITHUB_SHA:0:12}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $TAG at $GITHUB_SHA"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run full automated test suite
        run: python -m pytest -q
      - name: Audit locked runtime and development dependencies
        shell: bash
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/pip-audit --requirement requirements-ci.lock
          .audit-venv/bin/pip-audit --requirement requirements-runtime.lock
          .audit-venv/bin/pip-audit --requirement requirements-ml.lock
          .audit-venv/bin/pip-audit --requirement requirements-deep-learning.txt
      - name: Build and smoke-test the non-root web container
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          docker build --tag "islandos-web:$IMAGE_TAG" .
          docker run --detach --name islandos-release-smoke --publish 127.0.0.1:8501:8501 "islandos-web:$IMAGE_TAG"
          test "$(docker exec islandos-release-smoke id -u)" -ne 0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Container health check passed."
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs islandos-release-smoke
              exit 1
            fi
            sleep 2
          done
          docker rm --force islandos-release-smoke
      - name: Create source archive, dependency inventory, checksums, and manifest
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="islandos-${RELEASE_TAG}/" HEAD > "dist/islandos-${RELEASE_TAG}-source.tar.gz"
          python -m pip freeze --all | sort > dist/python-dependency-inventory.txt
          cp requirements-ci.lock requirements-runtime.lock requirements-ml.lock requirements-deep-learning.txt dist/
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          root = Path("dist")
          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "artifact_type": "IslandOS release candidate",
              "tag_or_candidate": tag,
              "git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "python_version": platform.python_version(),
              "platform": platform.platform(),
              "dependency_lock_sha256": {
                  name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for name in (
                      "requirements-ci.lock", "requirements-runtime.lock",
                      "requirements-ml.lock", "requirements-deep-learning.txt"
                  )
              },
              "source_archive": f"islandos-{tag}-source.tar.gz",
              "source_archive_sha256": hashlib.sha256(
                  (root / f"islandos-{tag}-source.tar.gz").read_bytes()
              ).hexdigest(),
              "checks": [
                  "compileall",
                  "pytest",
                  "pip-audit on CI/runtime/ML/deep-learning dependency specifications",
                  "Docker build",
                  "non-root container health smoke test",
              ],
              "field_deployment_approved": False,
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          checksums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.iterdir())
              if path.is_file() and path.name not in {"SHA256SUMS.json", "SHA256SUMS.txt"}
          }
          (root / "SHA256SUMS.json").write_text(
              json.dumps(checksums, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: islandos-release-${{ steps.metadata.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Open a draft GitHub release for a verified version tag
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.create_draft_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/islandos-$RELEASE_TAG-source.tar.gz" \
            dist/SHA256SUMS.txt dist/SHA256SUMS.json \
            dist/release-manifest.json dist/python-dependency-inventory.txt \
            dist/requirements-ci.lock dist/requirements-runtime.lock \
            dist/requirements-ml.lock dist/requirements-deep-learning.txt \
            --draft --title "IslandOS $RELEASE_TAG" \
            --notes-file CHANGELOG.md
