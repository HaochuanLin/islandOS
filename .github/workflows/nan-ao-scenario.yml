name: Nan'ao hybrid scenario validation

on:
  push:
    branches:
      - nan-ao-scenario-pilot
  pull_request:
    branches:
      - nan-ao-scenario-pilot

jobs:
  hybrid-scenario:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the single scenario script
        run: python -m py_compile islandos_nanao_hybrid.py
      - name: Run hybrid scenario tests
        run: python -m unittest discover -s tests -p 'test_nan_ao_*.py' -v
      - name: Generate the single hybrid result
        run: python islandos_nanao_hybrid.py --runs 1000 --output-dir build/outputs
      - name: Verify output contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          with Path("build/outputs/scenario_result.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 1, rows
          assert rows[0]["scenario"] == "IslandOS_hybrid_clean_energy", rows
          meta = json.loads(Path("build/outputs/sim_meta.json").read_text(encoding="utf-8"))
          assert meta["run_count"] == 1000, meta
          assert meta["key_assumptions"]["ro_purchase_capex_rmb"] == 0, meta
          PY
      - name: Upload hybrid outputs
        uses: actions/upload-artifact@v4
        with:
          name: islandos-nanao-hybrid-output
          path: build/outputs/
          if-no-files-found: error
          retention-days: 90
