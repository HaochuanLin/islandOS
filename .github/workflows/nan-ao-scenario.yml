name: Nan'ao scenario validation

on:
  push:
    branches:
      - nan-ao-scenario-pilot
  pull_request:
    branches:
      - nan-ao-scenario-pilot

jobs:
  scenario:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile scenario scripts
        run: python -m compileall -q nan_ao_scenario.py nan_ao_three_scenarios.py
      - name: Run Nan'ao scenario tests
        run: python -m unittest discover -s tests -p 'test_nan_ao_*.py' -v
      - name: Generate reproducible scenario outputs
        run: python nan_ao_scenario.py --runs 1000 --output-dir build/nan_ao
      - name: Upload scenario outputs
        uses: actions/upload-artifact@v4
        with:
          name: nan-ao-emergency-scenario-outputs
          path: build/nan_ao/
          if-no-files-found: error
      - name: Generate three-scenario comparison
        run: python nan_ao_three_scenarios.py --output-json build/nan_ao_three_scenarios/summary.json
      - name: Upload three-scenario report
        uses: actions/upload-artifact@v4
        with:
          name: nan-ao-emergency-three-scenario-report
          path: build/nan_ao_three_scenarios/summary.json
          if-no-files-found: error
          retention-days: 90
