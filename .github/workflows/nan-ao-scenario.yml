name: Nan'ao hybrid scenario validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile single scenario script
        run: python -m py_compile islandos_nanao_hybrid.py
      - name: Run hybrid scenario tests
        run: python -m unittest discover -s tests -p 'test_nan_ao_hybrid.py' -v
      - name: Generate single hybrid result
        run: python islandos_nanao_hybrid.py --runs 1000 --output-dir build/outputs
      - name: Validate output contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("build/outputs")
          with (root / "scenario_result.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 1, rows
          assert rows[0]["scenario"] == "IslandOS_hybrid_clean_energy", rows
          meta = json.loads((root / "sim_meta.json").read_text(encoding="utf-8"))
          assert meta["run_count"] == 1000, meta
          assert meta["parameters"]["ro_purchase_capex_rmb"] == 0, meta
          assert meta["parameters"]["ro_rated_power_kw"] == 100.0, meta
          assert meta["parameters"]["ro_availability_factor"] == 0.925, meta
          assert "simulated_annual_wind_curtailment_hours_median" in meta["calculated_values"], meta
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: islandos-nan-ao-hybrid-output
          path: build/outputs/
          if-no-files-found: error
          retention-days: 30
