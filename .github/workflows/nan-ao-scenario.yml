name: Nan'ao scenario validation

on:
  push:
    branches:
      - nan-ao-scenario-pilot
  pull_request:
    branches:
      - main
      - nan-ao-scenario-pilot

jobs:
  scenario:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile interactive dashboard
        run: python -m compileall -q app.py island_microgrid_ro_sim.py

      - name: Run Nan'ao scenario tests
        run: python -m unittest discover -s tests -v
      - name: Generate reproducible scenario outputs
        run: python nan_ao_scenario.py --runs 1000 --seed 20261021 --output-dir build/nan_ao
      - name: Upload CSV and JSON outputs
        uses: actions/upload-artifact@v4
        with:
          name: islandos-nan-ao-scenario
          path: build/nan_ao/
          if-no-files-found: error
      - name: Run three-scenario Monte Carlo comparison (exploratory)
        run: python nan_ao_three_scenarios.py --output-json build/nan_ao_three_scenarios/summary.json
      - name: Upload three-scenario comparison report
        uses: actions/upload-artifact@v4
        with:
          name: islandos-nan-ao-three-scenarios-exploratory
          path: build/nan_ao_three_scenarios/summary.json
          if-no-files-found: error
          retention-days: 90
