name: RO simulation tests

on:
  push:
    branches:
      - main
      - "draft/**"
      - core-product-hardening
      - water-demand-forecast-demo
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islandos-ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR/feature-branch runs, but never cancel main-branch verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-runtime.lock
            requirements-ml.lock
            requirements-deep-learning.txt
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -r requirements-ci.lock
      - name: Verify dependency lock coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          def pins(path):
              result = {}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or stripped.startswith("-r "):
                      continue
                  req = Requirement(stripped)
                  assert req.specifier and "==" in str(req.specifier), f"Lock entry must be pinned: {path}: {stripped}"
                  result[canonicalize_name(req.name)] = Version(str(req.specifier).split("==", 1)[1])
              return result

          ci = pins("requirements-ci.lock")
          ml = pins("requirements-ml.lock")
          for declared_path in ("requirements.txt", "requirements-ml.txt"):
              for line in Path(declared_path).read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or stripped.startswith("-r "):
                      continue
                  requirement = Requirement(stripped)
                  name = canonicalize_name(requirement.name)
                  assert name in ci, f"{name} missing from requirements-ci.lock"
                  assert requirement.specifier.contains(ci[name], prereleases=True), f"{name} pin {ci[name]} violates {stripped}"
          for name, version in ml.items():
              assert ci.get(name) == version, f"ML lock mismatch for {name}: {version} != {ci.get(name)}"
          print(f"Validated {len(ci)} exact CI pins and {len(ml)} exact ML pins.")
          PY
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Capture reproducibility environment manifest
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          Path("build/reproducibility").mkdir(parents=True, exist_ok=True)
          freeze = subprocess.run(
              [sys.executable, "-m", "pip", "freeze", "--all"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          manifest = {
              "python_version": sys.version,
              "python_executable": sys.executable,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_ref": os.environ.get("GITHUB_REF"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "installed_distributions": sorted(freeze),
              "limitations": [
                  "This manifest records the environment used for this run; it is not a dependency lockfile.",
                  "Floating requirements may resolve to different versions in future runs.",
                  "Synthetic fixtures do not establish real-site validity.",
              ],
          }
          Path("build/reproducibility/environment.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Captured Python, platform, commit, run, and installed-package metadata.")
          PY
      - name: Validate reproducibility environment manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/reproducibility/environment.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          required = {
              "python_version", "platform", "github_sha", "github_run_id",
              "installed_distributions", "limitations",
          }
          missing = sorted(required - manifest.keys())
          assert not missing, f"Environment manifest missing keys: {missing}"
          assert manifest["github_sha"], "Manifest must identify the source commit"
          assert manifest["installed_distributions"], "Manifest must list installed packages"
          assert len(manifest["installed_distributions"]) == len(set(manifest["installed_distributions"]))
          assert manifest["limitations"], "Manifest must state its interpretation limits"
          print("Reproducibility environment manifest is valid and identifies this commit.")
          PY
      - name: Run complete pytest suite (including unittest-compatible tests)
        run: python -m pytest -q
      - name: Run dependency-free plug-in forecast example
        run: python examples/forecast_plugin_example.py
      - name: Run synthetic forecast-monitoring example
        run: |
          python experiments/monitor_forecast_performance.py data/examples/synthetic_forecast_monitor_demo.csv --window-hours 24 --output build/water-demand-forecast/monitor-demo.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-demand-forecast/monitor-demo.json").read_text(encoding="utf-8"))
          assert report["status"] == "review_recommended"
          assert report["row_count"] == 72
          assert report["window_count"] == 3
          assert abs(report["baseline_window"]["metrics"]["mae_m3_per_hour"] - 1.0) < 1e-9
          assert report["most_recent_window"]["metrics"]["mae_m3_per_hour"] == 8.0
          print("Synthetic forecast-monitoring smoke test passed.")
          PY
      - name: Upload forecast-monitoring example report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-forecast-monitor-demo
          path: build/water-demand-forecast/monitor-demo.json
          if-no-files-found: error
          retention-days: 30
      - name: Run synthetic forecast-candidate review gate
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path("build/water-demand-forecast/candidate-comparison.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          start = datetime(2026, 2, 1, tzinfo=timezone.utc)
          with path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=[
                  "timestamp", "actual_water_demand_m3",
                  "incumbent_forecast_m3", "candidate_forecast_m3",
              ])
              writer.writeheader()
              for i in range(48):
                  actual = 30.0 + (i % 8)
                  writer.writerow({
                      "timestamp": (start + timedelta(hours=i)).isoformat(),
                      "actual_water_demand_m3": actual,
                      "incumbent_forecast_m3": actual + 1.0,
                      "candidate_forecast_m3": actual + 0.2,
                  })
          PY
          python experiments/evaluate_forecast_candidate.py \
            build/water-demand-forecast/candidate-comparison.csv \
            --high-demand-threshold-m3 37 \
            --min-mae-improvement-fraction 0.05 \
            --output build/water-demand-forecast/candidate-review.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-demand-forecast/candidate-review.json").read_text(encoding="utf-8"))
          assert report["status"] == "candidate_recommended_for_review"
          assert report["row_count"] == 48
          assert report["decision_checks"]["overall_mae_check_passed"] is True
          assert report["decision_checks"]["high_demand_risk_check_passed"] is True
          print("Synthetic forecast-candidate review smoke test passed.")
          PY
      - name: Upload forecast-candidate review report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-forecast-candidate-review
          path: build/water-demand-forecast/candidate-review.json
          if-no-files-found: error
          retention-days: 30
      # NSGA-II correctness tests are already included in the complete pytest suite above.
      - name: Run synthetic water-demand forecast example
        run: |
          python experiments/water_demand_forecast.py data/examples/synthetic_water_demand_demo.csv --output build/water-demand-forecast/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-demand-forecast/report.json").read_text(encoding="utf-8"))
          assert report["status"] == "baseline_evaluated"
          assert report["row_count"] == 336
          assert report["test_rows"] > 0
          assert {"persistence", "seasonal_naive_24h"}.issubset(report["test_metrics"])
          assert "nominal_90pct" in report["seasonal_prediction_intervals"]
          print("Synthetic water-demand forecast smoke test passed.")
          PY
      - name: Compare water-demand ML with naive baselines
        run: |
          python experiments/compare_water_demand_models.py data/examples/synthetic_water_demand_demo.csv --output build/water-demand-forecast/model-comparison.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-demand-forecast/model-comparison.json").read_text(encoding="utf-8"))
          assert report["status"] == "models_compared"
          assert report["chronological_split"]["test_samples"] > 0
          expected = {"persistence_previous_hour", "seasonal_naive_previous_day", "seasonal_naive_previous_week", "hist_gradient_boosting"}
          assert expected == set(report["test_metrics"])
          assert all(metric["mae_m3_per_hour"] >= 0 for metric in report["test_metrics"].values())
          print("Synthetic water-demand ML comparison smoke test passed.")
          PY
      - name: Join ML water-demand forecasts to dispatch and evaluate
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-demand-forecast/model-comparison.json").read_text(encoding="utf-8"))
          rows = report["forecast_rows"]
          assert rows, "ML comparison must provide out-of-sample forecast rows"
          output = Path("build/forecast-dispatch/power-input.csv")
          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=[
                  "timestamp_utc", "actual_surplus_kw", "forecast_surplus_kw",
                  "water_demand_m3", "cooling_demand_kw_th",
              ])
              writer.writeheader()
              for index, row in enumerate(rows):
                  writer.writerow({
                      "timestamp_utc": row["timestamp"],
                      "actual_surplus_kw": 22 + index % 9,
                      "forecast_surplus_kw": 21 + index % 9,
                      "water_demand_m3": row["actual_water_demand_m3"],
                      "cooling_demand_kw_th": 8 + index % 4,
                  })
          print(f"Created a clearly synthetic paired power trace for {len(rows)} ML forecast timestamps.")
          PY
          python experiments/build_forecast_dispatch_input.py \
            build/forecast-dispatch/power-input.csv \
            build/water-demand-forecast/model-comparison.json \
            --forecast-column hist_gradient_boosting \
            --output build/forecast-dispatch/paired-with-water-forecast.csv
          python experiments/evaluate_forecast_dispatch.py \
            build/forecast-dispatch/paired-with-water-forecast.csv \
            --output build/forecast-dispatch/results.json
          python - <<'PY'
          import json
          from pathlib import Path

          joined = json.loads(Path("build/forecast-dispatch/paired-with-water-forecast.report.json").read_text(encoding="utf-8"))
          result = json.loads(Path("build/forecast-dispatch/results.json").read_text(encoding="utf-8"))
          assert joined["status"] == "forecast_dispatch_input_built"
          assert joined["forecast_column_used"] == "hist_gradient_boosting"
          assert joined["matched_rows"] > 0
          assert result["time_basis"]["rows"] == joined["matched_rows"]
          assert result["water_demand_input"]["forecast_column_used"] == "forecast_water_demand_m3"
          assert result["water_demand_input"]["actual_demand_is_used_for_execution"] is True
          assert result["water_demand_input"]["forecast_demand_is_used_for_planning"] is True
          water_baseline = result["water_demand_input"]["persistence_baseline_comparison"]
          assert water_baseline["status"] == "evaluated"
          assert water_baseline["aligned_hours"] == joined["matched_rows"] - 1
          assert water_baseline["forecast_metrics"]["persistence_baseline"]["evaluated_hours"] == joined["matched_rows"] - 1
          print("Model-generated water forecast → dispatch integration smoke test passed.")
          PY
      - name: Upload model-generated forecast-to-dispatch report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-model-water-forecast-dispatch
          path: |
            build/forecast-dispatch/paired-with-water-forecast.report.json
            build/forecast-dispatch/results.json
          if-no-files-found: error
          retention-days: 30
      - name: Run repeated chronological water-demand backtest
        run: |
          python experiments/backtest_water_demand_models.py data/examples/synthetic_water_demand_demo.csv --initial-train-fraction 0.65 --test-window-hours 24 --step-hours 24 --output build/water-demand-forecast/rolling-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-demand-forecast/rolling-backtest.json").read_text(encoding="utf-8"))
          assert report["status"] == "rolling_backtest_completed"
          assert report["configuration"]["fold_count"] >= 3
          assert report["configuration"]["evaluated_hours"] > 0
          assert set(report["aggregate_metrics"]) == {
              "persistence_previous_hour",
              "seasonal_naive_previous_day",
              "seasonal_naive_previous_week",
              "hist_gradient_boosting",
          }
          assert all(fold["training_end"] < fold["test_start"] for fold in report["folds"])
          assert report["high_demand_evaluation"]["event_count"] > 0
          peak_metrics = report["high_demand_evaluation"]["pooled_metrics_by_model"]
          assert set(peak_metrics) == set(report["aggregate_metrics"])
          assert all(0 <= metric["underforecast_rate"] <= 1 for metric in peak_metrics.values())
          print("Repeated chronological water-demand backtest smoke test passed.")
          PY
      - name: Upload water-demand rolling backtest report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-water-demand-rolling-backtest
          path: build/water-demand-forecast/rolling-backtest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload water-demand ML comparison report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-water-demand-ml-comparison
          path: build/water-demand-forecast/model-comparison.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload water-demand forecast example report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-water-demand-forecast-demo
          path: build/water-demand-forecast/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate reproducible dispatch report
        run: python experiments/generate_dispatch_report.py --output-dir build/dispatch-report
      - name: Verify synthetic benchmark fixture reproducibility
        run: python experiments/generate_synthetic_dispatch_benchmark.py --check
      - name: Evaluate fixed synthetic forecast-to-dispatch benchmark
        run: >-
          python experiments/evaluate_forecast_dispatch.py
          data/examples/synthetic_dispatch_benchmark.csv
          --output build/forecast-dispatch-benchmark/results.json
      - name: Validate forecast-to-dispatch benchmark report
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("build/forecast-dispatch-benchmark/results.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["time_basis"]["rows"] == 168
          assert report["time_basis"]["interval_hours"] == 1
          assert report["forecast_metrics"]["evaluated_hours"] == 168
          assert all(
              math.isfinite(report["forecast_metrics"][key])
              for key in ("mae_kw", "rmse_kw", "bias_forecast_minus_actual_kw")
          )
          expected_policies = {"rolling", "ro_first", "ice_first", "perfect_information"}
          assert set(report["policy_comparison"]) == expected_policies
          for name, result in report["policy_comparison"].items():
              for metric in (
                  "water_unmet_m3",
                  "cooling_unmet_kwh_th",
                  "remaining_surplus_kwh",
                  "normalized_score",
              ):
                  assert math.isfinite(result[metric]), (name, metric)
                  assert result[metric] >= 0, (name, metric)
          assert report["persistence_baseline_comparison"]["status"] == "evaluated"
          assert report["persistence_baseline_comparison"]["aligned_hours"] == 167
          assert report["limitations"], "Report must preserve interpretation limits"
          print("Forecast-to-dispatch benchmark report schema and numeric invariants passed.")
          PY
      - name: Verify synthetic water-forecast dispatch fixture
        run: python experiments/generate_synthetic_water_forecast_dispatch.py --check
      - name: Evaluate synthetic water-forecast dispatch integration
        run: |
          python experiments/evaluate_forecast_dispatch.py data/examples/synthetic_water_forecast_dispatch.csv --output build/water-forecast-dispatch/results.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/water-forecast-dispatch/results.json").read_text(encoding="utf-8"))
          assert report["water_demand_input"]["forecast_column_used"] == "forecast_water_demand_m3"
          assert report["water_demand_input"]["actual_demand_is_used_for_execution"] is True
          assert report["water_demand_input"]["forecast_demand_is_used_for_planning"] is True
          assert report["water_demand_input"]["forecast_demand_metrics"]["evaluated_hours"] == 168
          audit = report["policy_comparison"]["rolling"]["hourly_audit"]
          assert len(audit) == 168
          assert audit[0]["actual_water_demand_m3"] == audit[0]["forecast_water_demand_m3"]
          assert any(row["actual_water_demand_m3"] != row["forecast_water_demand_m3"] for row in audit[1:])
          print("Synthetic forecast-water-demand-to-dispatch smoke test passed.")
          PY
      - name: Upload water-forecast dispatch report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-water-forecast-dispatch-demo
          path: build/water-forecast-dispatch/results.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload forecast-dispatch benchmark
        uses: actions/upload-artifact@v7
        with:
          name: islandos-forecast-dispatch-benchmark
          path: build/forecast-dispatch-benchmark/results.json
          if-no-files-found: error
          retention-days: 30
      - name: Benchmark NSGA-II against exact Pareto fronts
        run: >-
          python experiments/benchmark_nsga2_vs_exhaustive.py
          --population-size 12 --generations 5 --seed 20261021
          --output build/pareto-benchmark/results.json
      - name: Summarize Pareto benchmark metrics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(Path("build/pareto-benchmark/results.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# NSGA-II vs exact Pareto benchmark\n\n")
              summary.write("Synthetic scenarios only; this measures search coverage, not physical-model accuracy.\n\n")
              summary.write("| Scenario | Search space | Exact front | NSGA-II front | Recall | Precision | NSGA-II evaluated |\n")
              summary.write("|---|---:|---:|---:|---:|---:|---:|\n")
              for result in results:
                  comparison = result["comparison"]
                  summary.write(
                      f"| {result['scenario']} | {result['decision_space_size']} | "
                      f"{result['exact']['pareto_front_count']} | {result['nsga2']['pareto_front_count']} | "
                      f"{comparison['exact_front_recall']:.1%} | {comparison['nsga2_front_precision']:.1%} | "
                      f"{result['nsga2']['unique_candidates_evaluated']} |\n"
                  )
          PY
      - name: Upload Pareto benchmark
        uses: actions/upload-artifact@v7
        with:
          name: islandos-pareto-benchmark
          path: build/pareto-benchmark/results.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload dispatch report
        uses: actions/upload-artifact@v7
        with:
          name: islandos-dispatch-report
          path: build/dispatch-report/
          if-no-files-found: error
          retention-days: 30
      - name: Upload reproducibility environment manifest
        uses: actions/upload-artifact@v7
        with:
          name: islandos-reproducibility-environment
          path: build/reproducibility/environment.json
          if-no-files-found: error
          retention-days: 90
