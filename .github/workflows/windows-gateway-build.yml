name: Build Windows telemetry gateway

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-gateway:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build portable gateway executable
        run: pyinstaller --clean --onefile --name islandos-gateway islandos_gateway.py
      - name: Smoke-test executable
        run: .\dist\islandos-gateway.exe --help
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: islandos-gateway-windows-x64
          path: dist/islandos-gateway.exe
          if-no-files-found: error
          retention-days: 30
