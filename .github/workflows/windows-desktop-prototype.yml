name: Windows desktop prototype build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - product-foundation-desktop-ready
    paths:
      - "desktop_app/**"
      - "islandos_core/**"
      - "requirements-desktop.txt"
      - ".github/workflows/windows-desktop-prototype.yml"

permissions:
  contents: read

concurrency:
  group: windows-desktop-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop-prototype:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install desktop runtime and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt openpyxl==3.1.5 pyinstaller==6.22.3

      - name: Compile shared core and desktop client
        run: |
          python -m compileall -q islandos_core desktop_app

      - name: Build Windows desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name IslandOS --paths . --collect-all PySide6 --collect-all openpyxl --exclude-module streamlit --exclude-module pandas --exclude-module matplotlib --exclude-module pymoo desktop_app/main.py

      - name: Verify executable artifact
        shell: pwsh
        run: |
          $exe = "dist/IslandOS/IslandOS.exe"
          if (!(Test-Path $exe)) {
            throw "Expected desktop executable was not created: $exe"
          }
          $size = (Get-Item $exe).Length
          if ($size -le 0) {
            throw "Desktop executable is empty"
          }
          Write-Host "Built $exe ($size bytes)"

      - name: Upload Windows desktop prototype
        uses: actions/upload-artifact@v4
        with:
          name: IslandOS-Windows-Desktop-Prototype
          path: dist/IslandOS/
          if-no-files-found: error
          retention-days: 14
