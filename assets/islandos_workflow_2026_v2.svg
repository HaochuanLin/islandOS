<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">IslandOS five-step energy and resource decision workflow</title>
<desc id="desc">INPUT validates data and assets; FORECAST estimates future conditions; COORDINATE generates feasible resource schedules; COMPARE evaluates trade-offs; DECIDE presents auditable evidence for human review. The workflow is advisory and simulation-first.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17345b" flood-opacity=".09"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8295ad"/></marker>
 <style>
 .title{font:700 29px Inter,Arial,sans-serif;fill:#17365d}.sub{font:15px Inter,Arial,sans-serif;fill:#60748e}
 .num{font:700 15px Inter,Arial,sans-serif;fill:#fff}.step{font:700 16px Inter,Arial,sans-serif;letter-spacing:.4px}
 .desc{font:14px Inter,Arial,sans-serif;fill:#425873}.status{font:600 10px Inter,Arial,sans-serif;letter-spacing:.4px}
 .foot{font:600 14px Inter,Arial,sans-serif;fill:#29496f}
 </style>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<text x="600" y="55" text-anchor="middle" class="title">From Energy Data to Intelligent Decisions</text>
<text x="600" y="82" text-anchor="middle" class="sub">A five-step, simulation-first workflow for energy and resource coordination</text>
<!-- card 1 -->
<g filter="url(#shadow)"><rect x="24" y="125" width="210" height="220" rx="16" fill="#fff" stroke="#a9c9f6"/><path d="M40 125H218Q234 125 234 141V174H24V141Q24 125 40 125Z" fill="#eaf2ff"/></g>
<circle cx="51" cy="150" r="15" fill="#2e6fce"/><text x="51" y="155" text-anchor="middle" class="num">1</text><text x="76" y="156" class="step" fill="#245da9">INPUT</text><rect x="146" y="137" width="76" height="22" rx="11" fill="#dceaff"/><text x="184" y="152" text-anchor="middle" class="status" fill="#245da9">FOUNDATION</text>
<text x="42" y="213" class="desc"><tspan x="42" dy="0">Organize energy,</tspan><tspan x="42" dy="22">demand, assets,</tspan><tspan x="42" dy="22">constraints and</tspan><tspan x="42" dy="22">data provenance.</tspan></text>
<!-- card 2 -->
<g filter="url(#shadow)"><rect x="263" y="125" width="210" height="220" rx="16" fill="#fff" stroke="#9bd9cd"/><path d="M279 125H457Q473 125 473 141V174H263V141Q263 125 279 125Z" fill="#e7f7f3"/></g>
<circle cx="290" cy="150" r="15" fill="#159783"/><text x="290" y="155" text-anchor="middle" class="num">2</text><text x="315" y="156" class="step" fill="#087a6c">FORECAST</text><rect x="382" y="137" width="80" height="22" rx="11" fill="#d9f2ec"/><text x="422" y="152" text-anchor="middle" class="status" fill="#087a6c">EXPERIMENTAL</text>
<text x="281" y="213" class="desc"><tspan x="281" dy="0">Estimate future</tspan><tspan x="281" dy="22">supply, demand,</tspan><tspan x="281" dy="22">prices and operating</tspan><tspan x="281" dy="22">conditions.</tspan></text>
<!-- card 3 -->
<g filter="url(#shadow)"><rect x="502" y="125" width="210" height="220" rx="16" fill="#fff" stroke="#c4b3f0"/><path d="M518 125H696Q712 125 712 141V174H502V141Q502 125 518 125Z" fill="#f0edfc"/></g>
<circle cx="529" cy="150" r="15" fill="#7452c8"/><text x="529" y="155" text-anchor="middle" class="num">3</text><text x="554" y="156" class="step" fill="#6544b3">COORDINATE</text><rect x="630" y="137" width="70" height="22" rx="11" fill="#e8e0fb"/><text x="665" y="152" text-anchor="middle" class="status" fill="#6544b3">LIMITED</text>
<text x="520" y="213" class="desc"><tspan x="520" dy="0">Generate resource</tspan><tspan x="520" dy="22">schedules under</tspan><tspan x="520" dy="22">supported equipment</tspan><tspan x="520" dy="22">and service limits.</tspan></text>
<!-- card 4 -->
<g filter="url(#shadow)"><rect x="741" y="125" width="210" height="220" rx="16" fill="#fff" stroke="#f1cf93"/><path d="M757 125H935Q951 125 951 141V174H741V141Q741 125 757 125Z" fill="#fff7e8"/></g>
<circle cx="768" cy="150" r="15" fill="#c48a25"/><text x="768" y="155" text-anchor="middle" class="num">4</text><text x="793" y="156" class="step" fill="#986719">COMPARE</text><rect x="870" y="137" width="70" height="22" rx="11" fill="#f9ebc9"/><text x="905" y="152" text-anchor="middle" class="status" fill="#986719">SELECTED</text>
<text x="759" y="213" class="desc"><tspan x="759" dy="0">Compare service,</tspan><tspan x="759" dy="22">cost, reliability</tspan><tspan x="759" dy="22">and resource-use</tspan><tspan x="759" dy="22">trade-offs.</tspan></text>
<!-- card 5 -->
<g filter="url(#shadow)"><rect x="980" y="125" width="196" height="220" rx="16" fill="#fff" stroke="#f2c39e"/><path d="M996 125H1160Q1176 125 1176 141V174H980V141Q980 125 996 125Z" fill="#fff2e7"/></g>
<circle cx="1007" cy="150" r="15" fill="#dc742c"/><text x="1007" y="155" text-anchor="middle" class="num">5</text><text x="1032" y="156" class="step" fill="#b65b20">DECIDE</text><rect x="1096" y="137" width="68" height="22" rx="11" fill="#ffe5d1"/><text x="1130" y="152" text-anchor="middle" class="status" fill="#b65b20">ADVISORY</text>
<text x="998" y="213" class="desc"><tspan x="998" dy="0">Review rationale,</tspan><tspan x="998" dy="22">risks, assumptions</tspan><tspan x="998" dy="22">and auditable</tspan><tspan x="998" dy="22">evidence.</tspan></text>
<!-- arrows -->
<path d="M238 235H255 M477 235H494 M716 235H733 M955 235H972" stroke="#8295ad" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1080 365V383H120V365" fill="none" stroke="#7890ad" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="392" text-anchor="middle" class="foot">Human review · operational feedback · updated measurements and assumptions</text>
<text x="600" y="418" text-anchor="middle" class="sub">Conceptual workflow — implementation maturity varies by step; no autonomous equipment control</text>
</svg>